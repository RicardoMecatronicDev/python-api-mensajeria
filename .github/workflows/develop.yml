name: Develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  IMAGE: python-api-mensajeria
  ACR_NOPROD: acrmensajerianoprod01

concurrency:
  group: develop
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      sonar: true
    secrets: inherit

  package:
    needs: ci
    runs-on: ubuntu-latest
    environment: noprod
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n "$ACR_NOPROD"
      - name: Build
        run: docker build -t "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.sha_tag }}" .
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ACR_NOPROD }}.azurecr.io/${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        run: docker push "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.sha_tag }}"

  version:
    needs: package
    runs-on: ubuntu-latest
    environment: noprod
    permissions:
      id-token: write
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: master
          pre_release_branches: develop
          append_to_pre_release_tag: rc
          default_bump: patch
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n "$ACR_NOPROD"
      - name: Agregar tag de version a la imagen
        run: |
          docker buildx imagetools create \
            -t "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.new_tag }}" \
            "$ACR_NOPROD.azurecr.io/$IMAGE:${{ needs.package.outputs.sha_tag }}"

  deploy:
    needs: version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: noprod
      image_tag: ${{ needs.version.outputs.new_tag }}
    secrets: inherit
