name: Deploy manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente destino
        type: choice
        options: [noprod, prod]
        required: true
      version:
        description: Tag de la imagen a desplegar (ej. v1.2.0)
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: python-api-mensajeria

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verificar que la imagen existe
        run: |
          ACR=${{ inputs.environment == 'prod' && 'acrmensajeriaprod01' || 'acrmensajerianoprod01' }}
          az acr repository show -n "$ACR" --image "$IMAGE:${{ inputs.version }}"

  approve:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'approver_prod' || 'approver_noprod' }}
    steps:
      - run: echo "Aprobado"

  deploy:
    needs: approve
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.version }}
    secrets: inherit
