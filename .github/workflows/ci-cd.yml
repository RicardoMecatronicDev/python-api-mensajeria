name: ci-cd

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente destino
        type: choice
        options: [noprod, prod]
        required: true
      version:
        description: Tag de la imagen a desplegar (ej. v1.2.0)
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: python-api-mensajeria
  ACR_NOPROD: acrmensajerianoprod01
  ACR_PROD: acrmensajeriaprod01
  SONAR_ORG: ricardomecatronicdev
  SONAR_PROJECT: RicardoMecatronicDev_python-api-mensajeria

jobs:
  # ---------- CI: develop, master y PR ----------
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: SonarCloud
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT }}
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

  # ---------- develop -> noprod ----------
  package:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: noprod
    permissions:
      id-token: write
      contents: read
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n "$ACR_NOPROD"
      - name: Build
        run: docker build -t "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.sha_tag }}" .
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_NOPROD }}.azurecr.io/${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push
        run: docker push "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.sha_tag }}"

  version:
    needs: package
    runs-on: ubuntu-latest
    environment: noprod
    permissions:
      id-token: write
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: master
          pre_release_branches: develop
          append_to_pre_release_tag: rc
          default_bump: patch
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n "$ACR_NOPROD"
      - name: Agregar tag de version a la imagen
        run: |
          docker buildx imagetools create \
            -t "$ACR_NOPROD.azurecr.io/$IMAGE:${{ steps.tag.outputs.new_tag }}" \
            "$ACR_NOPROD.azurecr.io/$IMAGE:${{ needs.package.outputs.sha_tag }}"

  deploy-noprod:
    needs: version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: noprod
      image_tag: ${{ needs.version.outputs.new_tag }}
    secrets: inherit

  # ---------- master -> prod (promover, no construir) ----------
  approve-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: approver_prod
    steps:
      - run: echo "Aprobado en approver_prod"

  release:
    needs: approve-prod
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit de develop que entro a master
        id: src
        run: |
          if ! git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            echo "El PR a master debe completarse con merge commit"
            exit 1
          fi
          echo "sha=$(git rev-parse --short=7 HEAD^2)" >> "$GITHUB_OUTPUT"
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          release_branches: master
          default_bump: patch
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Promover imagen de noprod a prod
        run: |
          az acr repository show -n "$ACR_NOPROD" --image "$IMAGE:${{ steps.src.outputs.sha }}" >/dev/null
          SRC_ID=$(az acr show -n "$ACR_NOPROD" --query id -o tsv)
          az acr import -n "$ACR_PROD" --registry "$SRC_ID" \
            --source "$IMAGE:${{ steps.src.outputs.sha }}" \
            --image "$IMAGE:${{ steps.tag.outputs.new_tag }}"

  deploy-prod:
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image_tag: ${{ needs.release.outputs.new_tag }}
    secrets: inherit

  # ---------- manual y rollback ----------
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verificar que la imagen existe
        run: |
          ACR=${{ inputs.environment == 'prod' && env.ACR_PROD || env.ACR_NOPROD }}
          az acr repository show -n "$ACR" --image "$IMAGE:${{ inputs.version }}"

  approve-manual:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: approver_prod
    steps:
      - run: echo "Aprobado en approver_prod"

  deploy-manual:
    needs: [validate, approve-manual]
    if: ${{ always() && needs.validate.result == 'success' && (needs.approve-manual.result == 'success' || needs.approve-manual.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.version }}
    secrets: inherit
